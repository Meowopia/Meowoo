// Optional local build routing. The project itself uses the official repositories.
settingsEvaluated { settings ->
    settings.pluginManagement.repositories.clear()
    settings.pluginManagement.repositories.maven { url = uri('https://maven.aliyun.com/repository/google') }
    settings.pluginManagement.repositories.maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
    settings.pluginManagement.repositories.maven { url = uri('https://maven.aliyun.com/repository/central') }
    settings.dependencyResolutionManagement.repositories.clear()
    settings.dependencyResolutionManagement.repositories.maven { url = uri('https://maven.aliyun.com/repository/google') }
    settings.dependencyResolutionManagement.repositories.maven { url = uri('https://maven.aliyun.com/repository/central') }
}
